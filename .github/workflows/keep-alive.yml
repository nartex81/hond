name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 6 */3 * *'  # elke 3 dagen om 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          curl -s -X GET \
            "https://uamgtqstdrhckpxmbriv.supabase.co/rest/v1/plekken?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
